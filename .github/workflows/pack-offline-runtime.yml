name: Pack Offline Runtime (Windows)

# 在云端组装 MangaJaNai 离线运行环境包，并发布到 Release。
#
# 为什么要在云端做：整包约 5 GB（Python 4.6 + 模型 0.47），从国内家宽上传极慢；
# 云端下载上游依赖是机房带宽，本地零流量。
#
# 产物布局与应用的 `MangaJaNaiBootstrap` 安装结果**同构**，可直接用
# 「设定 → 超分 → 运行环境 → 导入运行环境压缩包」导入：
#
#   python/python/python.exe
#   backend/src/run_upscale.py + backend/ImageMagick/*.icc
#   models/  ← 16 个链模型
#
# ⚠️ GitHub Release 单文件上限 2 GB，因此用 7z 分卷（-v1800m）。
#    用户需先合并分卷再导入：`copy /b x.7z.001+x.7z.002+... x.7z`
#    （仓库里同时提供「合并分卷.bat」）。
#
# ⚠️ 依赖清单必须与 `lib/page/setting/real_sr/service/mangajanai_bootstrap.dart`
#    保持一致（Python 版本 / PyPI 清单 / torch 版本 / pyvips 的
#    --no-build-isolation 特殊处理）。改动那边时**必须同步改这里**。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（不存在会自动创建）"
        required: true
        default: "offline-runtime-v1"
      compression:
        description: "7z 压缩级别（1-9，越高越慢）"
        required: true
        default: "5"

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-2025-vs2026
    timeout-minutes: 300

    env:
      PY_VER: "3.12.10"
      PY_KEY: "312"
      TORCH_VER: "2.9.1"
      TORCHVISION_VER: "0.24.1"
      TAG: ${{ inputs.tag }}
      MX: ${{ inputs.compression }}

    steps:
      - uses: actions/checkout@v5

      - name: 准备目录
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pack = Join-Path $env:RUNNER_TEMP 'pack'
          $dl   = Join-Path $env:RUNNER_TEMP 'dl'
          New-Item -ItemType Directory -Force -Path $pack, $dl | Out-Null
          "PACK=$pack"     | Add-Content -Path $env:GITHUB_ENV
          "DL=$dl"         | Add-Content -Path $env:GITHUB_ENV
          "PYDIR=$pack\python\python" | Add-Content -Path $env:GITHUB_ENV

      - name: 下载并解压 Python embeddable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://www.python.org/ftp/python/$env:PY_VER/python-$env:PY_VER-embed-amd64.zip"
          $zip = "$env:DL\python-embed.zip"
          Write-Host "GET $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          New-Item -ItemType Directory -Force -Path $env:PYDIR | Out-Null
          Expand-Archive -Path $zip -DestinationPath $env:PYDIR -Force
          # embeddable 默认禁用 site-packages；与 Bootstrap 写入的内容完全一致。
          Set-Content -Path "$env:PYDIR\python$($env:PY_KEY)._pth" -Value "python$($env:PY_KEY).zip`nDLLs`nLib`n.`nLib/site-packages" -NoNewline
          Add-Content -Path "$env:PYDIR\python$($env:PY_KEY)._pth" -Value ""
          & "$env:PYDIR\python.exe" -c "import sys; print(sys.version)"

      - name: 安装 pip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $getpip = "$env:DL\get-pip.py"
          Invoke-WebRequest -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getpip -UseBasicParsing
          & "$env:PYDIR\python.exe" $getpip --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "get-pip 失败：$LASTEXITCODE" }

      - name: 安装 PyPI 依赖
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgs = @(
            'chainner_ext==0.3.10',
            'numpy==2.2.5',
            'opencv-python==4.11.0.86',
            'packaging==25.0',
            'psutil==6.0.0',
            'pynvml==11.5.3',
            'pyvips-binary==8.16.1',
            'rarfile==4.2',
            'sanic==24.6.0'
          )
          & "$env:PYDIR\python.exe" -m pip install --no-warn-script-location @pkgs
          if ($LASTEXITCODE -ne 0) { throw "PyPI 依赖安装失败：$LASTEXITCODE" }

      - name: 安装 pyvips（只有 sdist，需关掉构建隔离）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:PYDIR\python.exe" -m pip install --no-warn-script-location setuptools wheel
          if ($LASTEXITCODE -ne 0) { throw "setuptools/wheel 安装失败" }
          & "$env:PYDIR\python.exe" -m pip install --no-warn-script-location --no-build-isolation pyvips==3.0.0
          if ($LASTEXITCODE -ne 0) { throw "pyvips 安装失败：$LASTEXITCODE" }

      - name: 安装 torch / torchvision（cu128）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:PYDIR\python.exe" -m pip install --no-warn-script-location `
            "torch==$env:TORCH_VER" "torchvision==$env:TORCHVISION_VER" `
            --index-url https://download.pytorch.org/whl/cu128
          if ($LASTEXITCODE -ne 0) { throw "torch 安装失败：$LASTEXITCODE" }

      - name: 安装依赖 torch 的包（必须在 cu128 之后）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:PYDIR\python.exe" -m pip install --no-warn-script-location spandrel==0.4.1 spandrel_extra_arches==0.2.0
          if ($LASTEXITCODE -ne 0) { throw "spandrel 安装失败：$LASTEXITCODE" }
          & "$env:PYDIR\python.exe" -c "import torch, cv2, sanic, pyvips; print('torch', torch.__version__, 'cuda_build', torch.version.cuda)"

      - name: 上游后端源码（main 分支 ZIP）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:DL\backend-main.zip"
          Invoke-WebRequest -Uri 'https://github.com/the-database/MangaJaNaiConverterGui/archive/refs/heads/main.zip' -OutFile $zip -UseBasicParsing
          $tmp = "$env:DL\backend-x"
          & "$env:PYDIR\python.exe" -m zipfile -e $zip $tmp
          # 上游是两层嵌套（<repo>-main/<repo>/backend/…），按内容递归定位。
          $hit = Get-ChildItem $tmp -Recurse -Filter 'run_upscale.py' |
                 Where-Object { $_.Directory.Name -eq 'src' -and $_.Directory.Parent.Name -eq 'backend' } |
                 Select-Object -First 1
          if (-not $hit) { throw '找不到 backend/src/run_upscale.py' }
          Copy-Item $hit.Directory.Parent.FullName "$env:PACK\backend" -Recurse -Force
          Get-ChildItem "$env:PACK\backend\ImageMagick" -Filter *.icc | ForEach-Object { Write-Host "ICC: $($_.Name)" }
          if (-not (Get-ChildItem "$env:PACK\backend\ImageMagick" -Filter *.icc)) { throw 'backend 里没有 ICC profile' }

      - name: 官方模型包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:PACK\models" | Out-Null
          $urls = @(
            'https://github.com/the-database/MangaJaNai/releases/download/1.0.0/MangaJaNai_V1_ModelsOnly.zip',
            'https://github.com/the-database/MangaJaNai/releases/download/3.0.0/IllustrationJaNai_V3denoise.zip'
          )
          foreach ($u in $urls) {
            $name = Split-Path $u -Leaf
            $zip = Join-Path $env:DL $name
            Write-Host "GET $name"
            Invoke-WebRequest -Uri $u -OutFile $zip -UseBasicParsing
            $x = Join-Path $env:DL "m-$([guid]::NewGuid().ToString('N'))"
            & "$env:PYDIR\python.exe" -m zipfile -e $zip $x
            # zip 内部结构不保证平铺，按扩展名递归收集。
            Get-ChildItem $x -Recurse -File | Where-Object { $_.Extension -in '.pth', '.safetensors' } |
              ForEach-Object { Copy-Item $_.FullName (Join-Path "$env:PACK\models" $_.Name) -Force }
          }
          Get-ChildItem "$env:PACK\models" | Select-Object Name, @{n='MB'; e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: 校验包内容（与校验器同一套要求）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $need = @(
            'python\python\python.exe',
            'backend\src\run_upscale.py'
          )
          $bad = @()
          foreach ($f in $need) { if (-not (Test-Path "$env:PACK\$f")) { $bad += $f } }
          if (-not (Get-ChildItem "$env:PACK\backend\ImageMagick" -Filter *.icc)) { $bad += 'backend\ImageMagick\*.icc' }

          $models = @(
            '2x_IllustrationJaNai_V3denoise_FDAT_M_unshuffle_30k_fp16.safetensors',
            '4x_IllustrationJaNai_V3denoise_FDAT_M_47k_fp16.safetensors'
          )
          $buckets = @(
            @{m='1200p'; i2='70k';  i4='70k'},
            @{m='1300p'; i2='75k';  i4='75k'},
            @{m='1400p'; i2='70k';  i4='105k'},
            @{m='1500p'; i2='90k';  i4='105k'},
            @{m='1600p'; i2='90k';  i4='70k'},
            @{m='1920p'; i2='70k';  i4='105k'},
            @{m='2048p'; i2='95k';  i4='70k'}
          )
          foreach ($b in $buckets) {
            $models += "2x_MangaJaNai_$($b.m)_V1_ESRGAN_$($b.i2).pth"
            $models += "4x_MangaJaNai_$($b.m)_V1_ESRGAN_$($b.i4).pth"
          }
          foreach ($m in $models) { if (-not (Test-Path "$env:PACK\models\$m")) { $bad += "models\$m" } }

          if ($bad.Count -gt 0) {
            Write-Host "缺失：" -ForegroundColor Red
            $bad | ForEach-Object { Write-Host "  $_" }
            throw "包内容校验失败（$($bad.Count) 项）"
          }
          $size = (Get-ChildItem $env:PACK -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "校验通过：$($models.Count) 个模型 + python + backend"
          Write-Host ("解压后体积：{0:N2} GB" -f ($size/1GB))

      - name: 许可与说明文件
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lic = @'
# 许可与署名 · MangaJaNai 离线运行环境包

本包由个人 fork（liuli-lan/Breeze）在 GitHub Actions 上组装，**仅供非商业用途**。

## 模型（models/）

- **MangaJaNai / IllustrationJaNai 模型** —— 作者 the-database，
  许可 **Creative Commons Attribution-NonCommercial 4.0 International (CC BY-NC 4.0)**。
  上游：https://github.com/the-database/MangaJaNai
  模型包：MangaJaNai_V1_ModelsOnly.zip（release 1.0.0）、
  IllustrationJaNai_V3denoise.zip（release 3.0.0）
  许可全文：https://creativecommons.org/licenses/by-nc/4.0/legalcode
  本包未修改模型权重，仅做原样再分发；若你要再分发本包，必须保留本段署名与许可声明。
  **不得用于商业目的。**

## Python 运行时（python/）

- CPython 3.12.10 embeddable —— Python Software Foundation License 2.0，
  https://www.python.org/downloads/release/python-31210/
- PyTorch / torchvision（cu128）—— BSD-3-Clause，https://github.com/pytorch/pytorch
- 其余 pip 依赖（numpy / opencv-python / spandrel / sanic / pyvips / pynvml 等）
  各自沿用其上游许可，见 `python/python/Lib/site-packages/*.dist-info/`。

## chaiNNer 后端（backend/）

- 来自 MangaJaNaiConverterGui 的 main 分支源码（作者 the-database），
  许可 **GPL-3.0**（以随包源码形式提供）。上游：
  https://github.com/the-database/MangaJaNaiConverterGui
- ImageMagick ICC profile 随该后端源码一同分发。

## 免责

本包按"现状"提供，不提供任何担保。超分需要 NVIDIA 独立显卡与驱动。
'@
          Set-Content -Path "$env:PACK\LICENSES.md" -Value $lic -Encoding utf8
          Write-Host "LICENSES.md 已写入"

      - name: 7z 分卷压缩（每卷 < 2 GB，适配 GitHub Release 单文件上限）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { $sevenZip = '7z' }
          $out = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "OUT=$out" | Add-Content -Path $env:GITHUB_ENV

          # 用 .\* 保证包内顶层就是 python/ backend/ models/ LICENSES.md
          Push-Location $env:PACK
          & $sevenZip a -t7z -m0=lzma2 -mx=$env:MX -mmt=on -v1800m "$out\mangajanai-win.7z" .\*
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "7z 压缩失败：$code" }

          Get-ChildItem "$out\mangajanai-win.7z.*" | Select-Object Name, @{n='MB'; e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize
          $total = (Get-ChildItem "$out\mangajanai-win.7z.*" | Measure-Object Length -Sum).Sum
          Write-Host ("分卷合计：{0:N2} GB" -f ($total/1GB))

      - name: 生成合并脚本与校验和
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bat = @'
@echo off
setlocal
cd /d "%~dp0"
echo 正在合并分卷...
copy /b mangajanai-win.7z.001+mangajanai-win.7z.002+mangajanai-win.7z.003+mangajanai-win.7z.004 mangajanai-win.7z
if errorlevel 1 goto fail
echo.
echo 合并完成：mangajanai-win.7z
echo 校验 SHA-256（应与 SHA256SUMS.txt 中一致）：
certutil -hashfile mangajanai-win.7z SHA256
echo.
echo 接下来：Breeze -^> 设定 -^> 超分 -^> 超分引擎 -^> MangaJaNai（本地）
echo          -^> 运行环境 -^> 导入运行环境压缩包 -^> 选择 mangajanai-win.7z
pause
exit /b 0
:fail
echo 合并失败：请确认所有 .7z.00N 分卷都下载在同一个文件夹内。
pause
exit /b 1
'@
          Set-Content -Path "$env:OUT\合并分卷并校验.bat" -Value $bat -Encoding ascii

          $lines = Get-ChildItem "$env:OUT\mangajanai-win.7z.*" | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)"
          }
          Set-Content -Path "$env:OUT\SHA256SUMS.txt" -Value $lines -Encoding utf8
          Get-Content "$env:OUT\SHA256SUMS.txt"

      - name: 发布到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $notes = @'
MangaJaNai 离线运行环境包（Windows）

- 解压后约 5 GB，含 Python 3.12.10 + torch 2.9.1（cu128）+ chaiNNer 后端 + 16 个 MangaJaNai 模型
- 因 GitHub 单文件 2 GB 上限，用 7z 分卷（每卷 1800 MB）
- 用法：把全部 `.7z.00N` 分卷与 `合并分卷并校验.bat` 放在同一目录，双击该 bat 得到 `mangajanai-win.7z`，
  再在 Breeze 里「设定 → 超分 → 超分引擎 → MangaJaNai（本地）→ 运行环境 → 导入运行环境压缩包」选择它
- 许可：模型为 CC BY-NC 4.0（**禁止商业用途**），详见包内 `LICENSES.md`
- 需要 NVIDIA 独立显卡与驱动；本包不包含模型之外的上游代码改动
'@
          Set-Content -Path "$env:OUT\RELEASE_NOTES.md" -Value $notes -Encoding utf8

          $files = Get-ChildItem "$env:OUT" -File | ForEach-Object { $_.FullName }

          & gh release view $env:TAG --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            & gh release create $env:TAG --repo $repo --title "MangaJaNai 离线运行环境包 $env:TAG" --notes-file "$env:OUT\RELEASE_NOTES.md"
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
          }
          & gh release upload $env:TAG --repo $repo --clobber @files
          if ($LASTEXITCODE -ne 0) { throw "上传 Release 资源失败" }
          & gh release view $env:TAG --repo $repo
