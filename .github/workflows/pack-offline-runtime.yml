name: Pack Offline Runtime (Windows)

# 在云端组装 MangaJaNai 离线运行环境包，并发布到 Release。
#
# 为什么在云端做：整包约 5 GB（Python 4.6 + 模型 0.47），从国内家宽上传极慢；
# 云端下载上游依赖走机房带宽，本地零流量。
#
# 产物布局与应用的 `MangaJaNaiBootstrap` 安装结果**同构**，可直接用
# 「设定 → 超分 → 运行环境 → 导入运行环境压缩包」导入：
#
#   python/python/python.exe
#   backend/src/run_upscale.py + backend/ImageMagick/*.icc
#   models/  ← 16 个链模型
#
# ⚠️ GitHub Release 单文件上限 2 GB → 打成单一 7z 后**自行按字节切分**
#    （每卷 1900 MB），随包提供 join-volumes.bat（双击即拼接回单一 7z）与
#    SHA256SUMS.txt。
#
# ⚠️ 默认用 py7zr 而不是 7-Zip：在 windows-2025-vs2026 镜像上，7-Zip 26.03
#    对 5.4 GB / 2.3 万文件的输入会在建归档瞬间报
#    "System ERROR: The parameter is incorrect"（同一二进制对小目录正常，
#    本机 7-Zip 26.01 对同样目录也正常）。py7zr 产物经 7-Zip 验证为标准 7z。
#    需要 7z 时用 workflow_dispatch 的 packer 输入切回去。
#
# ⚠️ 依赖清单必须与 `lib/page/setting/real_sr/service/mangajanai_bootstrap.dart`
#    保持一致（Python 版本 / PyPI 清单 / torch 版本 / pyvips 的
#    --no-build-isolation 特殊处理）。改那边时必须同步改这里。
#
# 许可与说明文案放在 `script/offline-pack/` 下，本文件只做拷贝 —— 避免在
# YAML 块标量里嵌大段文本（顶格的 here-string 会截断 `run: |` 块）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（不存在会自动创建）"
        required: true
        default: "offline-runtime-v1"
      compression:
        description: "7z 压缩级别（1-9，越高越慢）"
        required: true
        default: "5"
      packer:
        description: "打包器：py7zr 稳、7z 快但本镜像会报参数错误"
        type: choice
        options:
          - py7zr
          - 7z
        default: py7zr

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-2025-vs2026
    timeout-minutes: 300

    env:
      PY_VER: "3.12.10"
      PY_KEY: "312"
      TORCH_VER: "2.9.1"
      TORCHVISION_VER: "0.24.1"
      TAG: ${{ inputs.tag }}
      MX: ${{ inputs.compression }}
      PACKER: ${{ inputs.packer }}

    steps:
      - uses: actions/checkout@v5

      # 打包用的 Python 与「包内自带的嵌入式 Python」是两回事：
      # 这里装 py7zr 只为了压包，不能污染包内的 site-packages。
      - name: 准备打包用 Python（py7zr）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 py7zr
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --no-warn-script-location py7zr
          if ($LASTEXITCODE -ne 0) { throw "py7zr 安装失败：$LASTEXITCODE" }
          python -c "import py7zr; print('py7zr', py7zr.__version__)"

      - name: 准备目录
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 一律放 C 盘：runner 的 D:\a\_temp 是临时盘，容量小且行为有差异
          # （实测 7-Zip 26.03 在那里写归档直接报 "The parameter is incorrect"）。
          $base = 'C:\pack'
          $pack = Join-Path $base 'pack'
          $dl   = Join-Path $base 'dl'
          New-Item -ItemType Directory -Force -Path $pack, $dl | Out-Null
          "PACK=$pack" | Add-Content -Path $env:GITHUB_ENV
          "DL=$dl" | Add-Content -Path $env:GITHUB_ENV
          "PYDIR=$pack\python\python" | Add-Content -Path $env:GITHUB_ENV
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='FreeGB'; e={[math]::Round($_.Free/1GB,1)}} | Format-Table -AutoSize

      - name: 选择打包器
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PACKER -ne '7z') {
            Write-Host '打包器：py7zr（默认，纯 Python，不受镜像上 7-Zip 的怪问题影响）'
            "SEVEN=py7zr" | Add-Content -Path $env:GITHUB_ENV
            exit 0
          }

          # 选了 7z 才做探针 —— 注意探针只证明「二进制可用」，
          # 不证明它能压大目录（本镜像上小目录 OK、5.4 GB 目录必挂）。
          $probeDir = 'C:\pack\probe'
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          Set-Content -Path "$probeDir\a.txt" -Value 'probe' -Encoding utf8

          $candidates = @('C:\Program Files\7-Zip\7z.exe')
          $portable = 'C:\pack\7zr.exe'
          try {
            Invoke-WebRequest -Uri 'https://www.7-zip.org/a/7zr.exe' -OutFile $portable -UseBasicParsing
            $candidates += $portable
          } catch { Write-Host "下载 7zr.exe 失败（忽略）：$_" }

          $chosen = $null
          foreach ($c in $candidates) {
            if (-not (Test-Path $c)) { Write-Host "SKIP $c（不存在）"; continue }
            $probe = "$probeDir\probe.7z"
            if (Test-Path $probe) { Remove-Item $probe -Force }
            Push-Location $probeDir
            & $c a -t7z -m0=lzma2 -mx=$env:MX -mmt=on $probe '.\*' 2>&1 | Select-Object -Last 8 | Write-Host
            $code = $LASTEXITCODE
            Pop-Location
            $exists = Test-Path $probe
            Write-Host "PROBE $c -> exit=$code created=$exists"
            if ($code -eq 0 -and $exists) { $chosen = $c; break }
          }
          if (-not $chosen) { throw '选了 7z 但没有任何可用候选，改跑一次用 packer=py7zr' }
          Write-Host "选用：$chosen"
          "SEVEN=$chosen" | Add-Content -Path $env:GITHUB_ENV

      - name: 下载并解压 Python embeddable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://www.python.org/ftp/python/$env:PY_VER/python-$env:PY_VER-embed-amd64.zip"
          $zip = "$env:DL\python-embed.zip"
          Write-Host "GET $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          New-Item -ItemType Directory -Force -Path $env:PYDIR | Out-Null
          Expand-Archive -Path $zip -DestinationPath $env:PYDIR -Force
          $pth = "$env:PYDIR\python$($env:PY_KEY)._pth"
          Set-Content -Path $pth -Value @("python$($env:PY_KEY).zip", 'DLLs', 'Lib', '.', 'Lib/site-packages')
          Get-Content $pth
          & "$env:PYDIR\python.exe" -c "import sys; print(sys.version)"

      - name: 安装 pip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $getpip = "$env:DL\get-pip.py"
          Invoke-WebRequest -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getpip -UseBasicParsing
          & "$env:PYDIR\python.exe" $getpip --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "get-pip 失败：$LASTEXITCODE" }

      - name: 安装 PyPI 依赖
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgs = @(
            'chainner_ext==0.3.10',
            'numpy==2.2.5',
            'opencv-python==4.11.0.86',
            'packaging==25.0',
            'psutil==6.0.0',
            'pynvml==11.5.3',
            'pyvips-binary==8.16.1',
            'rarfile==4.2',
            'sanic==24.6.0'
          )
          & "$env:PYDIR\python.exe" -m pip install --no-warn-script-location @pkgs
          if ($LASTEXITCODE -ne 0) { throw "PyPI 依赖安装失败：$LASTEXITCODE" }

      - name: 安装 pyvips（只有 sdist，需关掉构建隔离）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:PYDIR\python.exe" -m pip install --no-warn-script-location setuptools wheel
          if ($LASTEXITCODE -ne 0) { throw "setuptools/wheel 安装失败" }
          & "$env:PYDIR\python.exe" -m pip install --no-warn-script-location --no-build-isolation pyvips==3.0.0
          if ($LASTEXITCODE -ne 0) { throw "pyvips 安装失败：$LASTEXITCODE" }

      - name: 安装 torch / torchvision（cu128）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:PYDIR\python.exe" -m pip install --no-warn-script-location `
            "torch==$env:TORCH_VER" "torchvision==$env:TORCHVISION_VER" `
            --index-url https://download.pytorch.org/whl/cu128
          if ($LASTEXITCODE -ne 0) { throw "torch 安装失败：$LASTEXITCODE" }

      - name: 安装依赖 torch 的包（必须在 cu128 之后）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:PYDIR\python.exe" -m pip install --no-warn-script-location spandrel==0.4.1 spandrel_extra_arches==0.2.0
          if ($LASTEXITCODE -ne 0) { throw "spandrel 安装失败：$LASTEXITCODE" }
          & "$env:PYDIR\python.exe" -c "import torch, cv2, sanic, pyvips; print('torch', torch.__version__, 'cuda_build', torch.version.cuda)"

      - name: 上游后端源码（main 分支 ZIP）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:DL\backend-main.zip"
          Invoke-WebRequest -Uri 'https://github.com/the-database/MangaJaNaiConverterGui/archive/refs/heads/main.zip' -OutFile $zip -UseBasicParsing
          $tmp = "$env:DL\backend-x"
          & "$env:PYDIR\python.exe" -m zipfile -e $zip $tmp
          $hit = Get-ChildItem $tmp -Recurse -Filter 'run_upscale.py' |
                 Where-Object { $_.Directory.Name -eq 'src' -and $_.Directory.Parent.Name -eq 'backend' } |
                 Select-Object -First 1
          if (-not $hit) { throw '找不到 backend/src/run_upscale.py' }
          Copy-Item $hit.Directory.Parent.FullName "$env:PACK\backend" -Recurse -Force
          Get-ChildItem "$env:PACK\backend\ImageMagick" -Filter *.icc | ForEach-Object { Write-Host "ICC: $($_.Name)" }
          if (-not (Get-ChildItem "$env:PACK\backend\ImageMagick" -Filter *.icc)) { throw 'backend 里没有 ICC profile' }

      - name: 官方模型包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:PACK\models" | Out-Null
          $urls = @(
            'https://github.com/the-database/MangaJaNai/releases/download/1.0.0/MangaJaNai_V1_ModelsOnly.zip',
            'https://github.com/the-database/MangaJaNai/releases/download/3.0.0/IllustrationJaNai_V3denoise.zip'
          )
          foreach ($u in $urls) {
            $name = Split-Path $u -Leaf
            $zip = Join-Path $env:DL $name
            Write-Host "GET $name"
            Invoke-WebRequest -Uri $u -OutFile $zip -UseBasicParsing
            $x = Join-Path $env:DL "m-$([guid]::NewGuid().ToString('N'))"
            & "$env:PYDIR\python.exe" -m zipfile -e $zip $x
            Get-ChildItem $x -Recurse -File | Where-Object { $_.Extension -in '.pth', '.safetensors' } |
              ForEach-Object { Copy-Item $_.FullName (Join-Path "$env:PACK\models" $_.Name) -Force }
          }
          Get-ChildItem "$env:PACK\models" | Select-Object Name, @{n='MB'; e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: 校验包内容（与校验器同一套要求）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          foreach ($f in @('python\python\python.exe', 'backend\src\run_upscale.py')) {
            if (-not (Test-Path "$env:PACK\$f")) { $bad += $f }
          }
          if (-not (Get-ChildItem "$env:PACK\backend\ImageMagick" -Filter *.icc)) { $bad += 'backend\ImageMagick\*.icc' }

          $models = @(
            '2x_IllustrationJaNai_V3denoise_FDAT_M_unshuffle_30k_fp16.safetensors',
            '4x_IllustrationJaNai_V3denoise_FDAT_M_47k_fp16.safetensors'
          )
          $buckets = @(
            @{m='1200p'; i2='70k'; i4='70k'},
            @{m='1300p'; i2='75k'; i4='75k'},
            @{m='1400p'; i2='70k'; i4='105k'},
            @{m='1500p'; i2='90k'; i4='105k'},
            @{m='1600p'; i2='90k'; i4='70k'},
            @{m='1920p'; i2='70k'; i4='105k'},
            @{m='2048p'; i2='95k'; i4='70k'}
          )
          foreach ($b in $buckets) {
            $models += "2x_MangaJaNai_$($b.m)_V1_ESRGAN_$($b.i2).pth"
            $models += "4x_MangaJaNai_$($b.m)_V1_ESRGAN_$($b.i4).pth"
          }
          foreach ($m in $models) { if (-not (Test-Path "$env:PACK\models\$m")) { $bad += "models\$m" } }

          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "  缺失: $_" }
            throw "包内容校验失败（$($bad.Count) 项）"
          }
          $size = (Get-ChildItem $env:PACK -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "校验通过：$($models.Count) 个模型 + python + backend"
          Write-Host ("解压后体积：{0:N2} GB" -f ($size/1GB))

      - name: 放入许可与说明
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'script\offline-pack\LICENSES.md' "$env:PACK\LICENSES.md" -Force
          Get-Item "$env:PACK\LICENSES.md" | Select-Object Name, Length

      # 压缩 5.4 GB 要 30 分钟以上，任何后续步骤出问题都别重付这个代价。
      # key 里的 v1 是「包内容版本」：上游资产版本变了就手动 +1。
      # 刻意不把 workflow 文件本身算进 key，否则改一行 YAML 就白压一次。
      - name: 尝试复用已压好的归档
        id: pack-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\pack\out\mangajanai-win.7z
          key: offline-pack-v1-mx${{ inputs.compression }}-${{ hashFiles('script/offline-pack/make-7z.py') }}

      - name: 7z 压缩后自行切分（每卷 1900 MB，低于 Release 的 2 GB 上限）
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.pack-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'C:\pack\out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "OUT=$out" | Add-Content -Path $env:GITHUB_ENV

          $archive = "$out\mangajanai-win.7z"
          if ((Test-Path $archive) -and $env:CACHE_HIT -eq 'true') {
            Write-Host "复用缓存归档：$((Get-Item $archive).Length) 字节"
          } else {
          Push-Location $env:PACK
          if ($env:SEVEN -eq 'py7zr') {
            # 用系统 Python（actions/setup-python 装的）+ 仓库里的脚本，
            # 不用包内嵌入的 Python —— 免得 py7zr 被打进离线包。
            # -X utf8：双保险（脚本内部也会 reconfigure），避免控制台代码页
            # 不是 UTF-8 时中文日志把脚本打挂。
            & python -X utf8 (Join-Path $env:GITHUB_WORKSPACE 'script\offline-pack\make-7z.py') $env:PACK $archive $env:MX
            $code = $LASTEXITCODE
          } else {
            Write-Host "使用 $env:SEVEN"
            & $env:SEVEN a -t7z -m0=lzma2 -mx=$env:MX -mmt=on $archive '.\*'
            $code = $LASTEXITCODE
          }
          Pop-Location
          if ($code -ne 0) { throw "压缩失败：$code" }
          }
          $size = (Get-Item $archive).Length
          Write-Host ("归档大小：{0:N2} GB" -f ($size/1GB))

          # 自行按字节切分（不用 7z 的 -v）：分卷本质就是纯字节切分，
          # 拼接回来即还原（合并脚本走 list 拼接，已本地验证可解压）。
          # ⚠️ 必须显式 Int64：归档约 2.6 GB，超出 Int32 上限，
          #    混用 Int32 字面量会让 Math::Min 去走 Int32 重载并抛
          #    "Value was either too large or too small for an Int32"。
          [int64]$partSize = 1900MB
          $buf = New-Object byte[] (4MB)
          $in = [System.IO.File]::OpenRead($archive)
          try {
            $idx = 0
            while ($in.Position -lt $in.Length) {
              $idx++
              $part = Join-Path $out ("mangajanai-win.7z.{0:D3}" -f $idx)
              [int64]$remaining = $in.Length - $in.Position
              [int64]$limit = [Math]::Min($partSize, $remaining)
              [int64]$written = 0
              $outStream = [System.IO.File]::Create($part)
              try {
                while ($written -lt $limit) {
                  $want = [int][Math]::Min([int64]$buf.Length, $limit - $written)
                  $read = $in.Read($buf, 0, $want)
                  if ($read -le 0) { break }
                  $outStream.Write($buf, 0, $read)
                  $written += $read
                }
              } finally { $outStream.Close() }
            }
          } finally { $in.Close() }
          # 归档本身留着：下一步要把它塞进缓存，好在后续重跑时省掉 30 分钟压缩。
          if ($idx -eq 0) { throw '切分失败：没有产出任何分卷' }

          Get-ChildItem "$out\mangajanai-win.7z.*" | Select-Object Name, @{n='MB'; e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize
          $total = (Get-ChildItem "$out\mangajanai-win.7z.*" | Measure-Object Length -Sum).Sum
          Write-Host ("分卷数：$idx，合计 {0:N2} GB" -f ($total/1GB))
          if ($total -ne $size) { throw "分卷合计 $total != 归档大小 $size" }

      - name: 缓存归档（供后续重跑复用）
        if: steps.pack-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\pack\out\mangajanai-win.7z
          key: offline-pack-v1-mx${{ inputs.compression }}-${{ hashFiles('script/offline-pack/make-7z.py') }}

      - name: 生成合并脚本与校验和
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 资产文件名一律用 ASCII：中文名经 gh release upload 会被改成
          # "default.bat"（实测），用户根本对不上号。
          Copy-Item 'script\offline-pack\join-volumes.bat' "$env:OUT\join-volumes.bat" -Force
          $lines = Get-ChildItem "$env:OUT\mangajanai-win.7z.*" | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)"
          }
          Set-Content -Path "$env:OUT\SHA256SUMS.txt" -Value $lines -Encoding utf8
          Get-Content "$env:OUT\SHA256SUMS.txt"
          Get-ChildItem $env:OUT | Select-Object Name, @{n='MB'; e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: 发布到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # 原生命令的失败不要抛异常，一律用 $LASTEXITCODE 判断（避免 pwsh 版本差异）。
          $PSNativeCommandUseErrorActionPreference = $false
          $repo = $env:GITHUB_REPOSITORY
          Copy-Item 'script\offline-pack\RELEASE_NOTES.md' "$env:OUT\RELEASE_NOTES.md" -Force
          # ⚠️ 必须排除整包归档本身：它 2.4 GB，超过 Release 单文件 2 GB 上限，
          #    上传会直接 HTTP 422。归档留着只是为了喂 actions/cache。
          $files = Get-ChildItem "$env:OUT" -File |
            Where-Object { $_.Name -ne 'mangajanai-win.7z' } |
            ForEach-Object { $_.FullName }
          foreach ($f in $files) {
            $len = (Get-Item $f).Length
            if ($len -gt 2GB) { throw "asset 超过 Release 单文件 2 GB 上限：$f（$len 字节）" }
          }
          Write-Host "待上传："
          $files | ForEach-Object { Write-Host ("  {0}  {1:N1} MB" -f (Split-Path $_ -Leaf), ((Get-Item $_).Length/1MB)) }

          $hasRelease = $false
          try {
            & gh release view $env:TAG --repo $repo | Out-Null
            $hasRelease = ($LASTEXITCODE -eq 0)
          } catch { $hasRelease = $false }

          if (-not $hasRelease) {
            & gh release create $env:TAG --repo $repo --title "MangaJaNai 离线运行环境包 $env:TAG" --notes-file "$env:OUT\RELEASE_NOTES.md"
            if ($LASTEXITCODE -ne 0) { throw '创建 Release 失败' }
          }

          # 单个 asset 上限 2 GB；分卷每卷 1800 MB，逐卷上传最稳。
          foreach ($f in $files) {
            Write-Host "UPLOAD $([System.IO.Path]::GetFileName($f))"
            & gh release upload $env:TAG --repo $repo --clobber $f
            if ($LASTEXITCODE -ne 0) { throw "上传失败: $f" }
          }
          & gh release view $env:TAG --repo $repo
